[package]
name = "ts_r_sound"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sound mode: the 14 TSR rules run after the regular check, escape hatches, configuration and the coverage report"

[lints]
workspace = true

[dependencies]
ts_r_span = { path = "../ts_r_span" }
ts_r_ast = { path = "../ts_r_ast" }
ts_r_binder = { path = "../ts_r_binder" }
ts_r_diagnostics = { path = "../ts_r_diagnostics" }
ts_r_config = { path = "../ts_r_config" }
ts_r_types = { path = "../ts_r_types" }
ts_r_checker = { path = "../ts_r_checker" }
ts_r_guard = { path = "../ts_r_guard" }
rustc-hash = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
ts_r_testing = { path = "../ts_r_testing" }
