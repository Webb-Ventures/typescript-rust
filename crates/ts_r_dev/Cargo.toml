[package]
name = "ts_r_dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ts-r-dev: the HMR dev server binary (replaces vite dev)"

[lints]
workspace = true

[[bin]]
name = "ts-r-dev"
path = "src/main.rs"

[dependencies]
ts_r_hmr = { path = "../ts_r_hmr" }
ts_r_transform = { path = "../ts_r_transform", features = ["hmr"] }
ts_r_bundler = { path = "../ts_r_bundler", features = ["hmr"] }
ts_r_ast = { path = "../ts_r_ast" }
ts_r_parser = { path = "../ts_r_parser" }
ts_r_codegen = { path = "../ts_r_codegen" }
ts_r_guard = { path = "../ts_r_guard" }
ts_r_sound = { path = "../ts_r_sound" }
ts_r_config = { path = "../ts_r_config" }
ts_r_cache = { path = "../ts_r_cache" }
serde_json = "1"

[dev-dependencies]
ts_r_testing = { path = "../ts_r_testing" }
