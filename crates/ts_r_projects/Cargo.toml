[package]
name = "ts_r_projects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Project references, up-to-date checks, .tsbuildinfo and the --build driver for ts-r-check"

[lints]
workspace = true

[dependencies]
ts_r_ast = { path = "../ts_r_ast" }
ts_r_config = { path = "../ts_r_config" }
ts_r_resolver = { path = "../ts_r_resolver" }
ts_r_checker = { path = "../ts_r_checker" }
ts_r_emit = { path = "../ts_r_emit" }
ts_r_decls = { path = "../ts_r_decls" }
ts_r_diagnostics = { path = "../ts_r_diagnostics" }
ts_r_span = { path = "../ts_r_span" }
rustc-hash = "2"
# The buildinfo's text hashes (as ts_r_cache and ts_r_decls hash content).
blake3 = "1.8"
# The buildinfo is JSON (our own schema, record 0012 decision 1).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ts_r_testing = { path = "../ts_r_testing" }
