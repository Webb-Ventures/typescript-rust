[package]
name = "ts_r_lint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ts-r-lint engine: rule engine, built-in rules, ESLint/oxlint/Biome config readers, eslint-disable handling"

[lints]
workspace = true

[dependencies]
ts_r_span = { path = "../ts_r_span" }
ts_r_ast = { path = "../ts_r_ast" }
ts_r_parser = { path = "../ts_r_parser" }
ts_r_cache = { path = "../ts_r_cache" }
ts_r_lexer = { path = "../ts_r_lexer" }
ts_r_config = { path = "../ts_r_config" }
ts_r_diagnostics = { path = "../ts_r_diagnostics" }
ts_r_binder = { path = "../ts_r_binder" }
ts_r_types = { path = "../ts_r_types" }
ts_r_checker = { path = "../ts_r_checker" }
ts_r_history = { path = "../ts_r_history" }
rustc-hash = "2"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
ts_r_testing = { path = "../ts_r_testing" }
