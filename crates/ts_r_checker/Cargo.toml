[package]
name = "ts_r_checker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The ts-r type checker: declared and inferred types, relations, narrowing and diagnostics"

[lints]
workspace = true

[dependencies]
ts_r_span = { path = "../ts_r_span" }
ts_r_ast = { path = "../ts_r_ast" }
ts_r_parser = { path = "../ts_r_parser" }
ts_r_binder = { path = "../ts_r_binder" }
ts_r_diagnostics = { path = "../ts_r_diagnostics" }
ts_r_config = { path = "../ts_r_config" }
ts_r_resolver = { path = "../ts_r_resolver" }
ts_r_types = { path = "../ts_r_types" }
rustc-hash = "2"

[dev-dependencies]
ts_r_testing = { path = "../ts_r_testing" }
# The conformance example reports declaration diagnostics through declaration emit, as
# tsc's harness does (a dev-dependency cycle: examples link the one library build).
ts_r_emit = { path = "../ts_r_emit" }
