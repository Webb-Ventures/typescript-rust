name: Preview cleanup

# Deletes a pull request's Cloudflare preview (pages.yml) when it is merged or closed, and sweeps
# daily for any preview whose pull request is no longer open. A closing PR only starts a runner
# when it has the "preview" label, which pages.yml adds when it deploys one.

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # write: the last step edits the preview comment (read-only got HTTP 403).
  pull-requests: write

concurrency:
  group: preview-cleanup-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Remove previews
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare credentials not set; nothing to clean up."
            exit 0
          fi
          bash .github/scripts/preview-cleanup.sh $PR
      - name: Update the preview comment
        if: github.event_name == 'pull_request'
        run: |
          marker='<!-- cf-preview -->'
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          [ -z "$id" ] || gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
            -f body="$marker
          **Preview removed:** this pull request is closed." > /dev/null
