name: CI re-run after approval

# Step two (see ci-approval.yml): re-runs the failed jobs of the pull request's CI and Pages runs
# on the approved commit when a run was blocked waiting for approval (its first job failed). The
# re-run checks the approval again, in the pull request's own context; this workflow never
# checks out or runs pull request code.

on:
  workflow_run:
    workflows: [CI approval]
    types: [completed]

permissions: {}

jobs:
  rerun:
    name: re-run blocked CI
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for workflow in ci.yml pages.yml; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$SHA&event=pull_request&per_page=1" \
              --jq '.workflow_runs[0] | select(.status == "completed" and .conclusion == "failure") | .id')
            if [ -z "$run" ]; then echo "No blocked $workflow run for $SHA."; continue; fi
            blocked=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
              --jq '[.jobs[] | select(.name == "top of stack?" and .conclusion == "failure")] | length')
            if [ "$blocked" = 0 ]; then echo "$workflow run $run failed after the approval check; not re-run."; continue; fi
            gh run rerun "$run" --failed -R "$GITHUB_REPOSITORY"
            echo "Re-ran $workflow run $run for $SHA."
          done
