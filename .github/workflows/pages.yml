name: Pages

# Builds ts-r.dev and deploys it to GitHub Pages from main.
# landing/ is the whole site, one Next.js static export: home, tools, /donate/ and, in launched
# mode, the docs, error-code pages, benchmarks and search. `npm run build` there also runs the
# site's checks (content, quoted numbers, lib/tools.ts, links and anchors). See landing/AGENTS.md.
# Once: Settings → Pages → Source: GitHub Actions, custom domain ts-r.dev.
# Runs on GitHub-hosted runners (2 vCPU where the OS offers it).
# Pull requests build the site as a check (in a stack, only the top PR); only pushes to main deploy.
# Who it builds for, as in ci.yml: pull requests whose author is trusted (an owner or member of
# the organization, or a login in the CODE_REVIEW_USERS variable). Anyone else's pull request
# fails its first job until a trusted user approves its latest commit; ci-rerun.yml then re-runs
# it. Fork pull requests get a read-only token and no secrets, and are never previewed.
# Dependabot's pull requests build straight away (as in ci.yml); they get a read-only token and
# only Dependabot secrets, so the build runs without POSTHOG_KEY and they are never previewed
# (dependabot[bot] is not a preview author, and the preview job skips without Cloudflare
# credentials anyway).
# Previews: a pull request from this repository whose author is in the PREVIEW_AUTHORS repository
# variable (comma-separated logins; default riley-wv) is also deployed to a Cloudflare Worker at
# https://preview-pr-<n>.ts-r.dev/ and linked in a PR comment. preview-cleanup.yml deletes it
# when the PR closes. Needs secret CLOUDFLARE_API_TOKEN and variable (or secret)
# CLOUDFLARE_ACCOUNT_ID; without them the preview job is skipped with a notice.
# Repository variables (optional): SITE_MODE (coming-soon or launched) overrides
# landing/data/site.json; SITE_URL (default https://ts-r.dev).
# Secret or variable POSTHOG_KEY (optional) adds PostHog analytics to landing/; variable
# POSTHOG_HOST (default https://us.i.posthog.com). See landing/AGENTS.md, Analytics.

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "ecosystem/STATUS.md"
      - ".github/workflows/pages.yml"
  # No path filter on pull requests: in a stack only the top PR builds, and its own diff need not
  # touch the site even when a PR below it does.
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stacked PRs: only the top PR of a stack runs CI (a PR is the top when no open PR is based
  # on its branch). Pushes to main always run. A PR also skips the build when the same site
  # inputs already built in a PR: a pass-marker artifact named after a hash of landing/,
  # ecosystem/STATUS.md, this workflow and the files that landing/data/conformance.json quotes.
  # A PR that gets a preview always builds: its preview must show its head, and a marker from
  # another PR (or an earlier commit of this one) says nothing about what that preview shows.
  stack:
    name: top of stack?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      top: ${{ steps.check.outputs.top == 'true' && steps.passed.outputs.hit != 'true' }}
      hash: ${{ steps.passed.outputs.hash }}
    steps:
      # The same gate as ci.yml's (and, like it, not the security boundary: a fork PR can edit
      # this file; "require approval for all outside contributors" is). It makes the build fail
      # for an untrusted PR nobody has approved. ci-rerun.yml re-runs it after an approval, and
      # finds it by this job's name.
      - name: Trusted author, or approved by a trusted user?
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED: ${{ vars.CODE_REVIEW_USERS || '["riley-wv"]' }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          trusted() { # login, author association
            case "$2" in OWNER | MEMBER) return 0 ;; esac
            jq -e --arg u "$1" 'index($u) != null' <<<"$TRUSTED" >/dev/null
          }
          if trusted "$AUTHOR" "$ASSOCIATION"; then exit 0; fi
          # Dependabot's version updates (.github/dependabot.yml): GitHub opens them from a branch
          # here, and their runs get a read-only token and no secrets. Its PRs still need a
          # maintainer's approving review to merge.
          if [ "$AUTHOR" = 'dependabot[bot]' ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then exit 0; fi
          while read -r login association; do
            if [ -n "$login" ] && trusted "$login" "$association"; then
              echo "::notice::@$login approved $HEAD_SHA for the site build."
              exit 0
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            --jq ".[] | select(.state == \"APPROVED\" and .commit_id == \"$HEAD_SHA\") | \"\(.user.login) \(.author_association)\"")
          echo "::error::The site builds for a pull request from @$AUTHOR once a maintainer approves its latest commit ($HEAD_SHA). Thanks for your patience."
          exit 1
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.head_ref }}
          # A fork's branch can share a name with one here (its main, say): never a stack.
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          above=
          [ "$FORK" = true ] || above=$(gh pr list -R "$GITHUB_REPOSITORY" --base "$HEAD" --state open --json number --jq 'map("#\(.number)") | join(" ")')
          if [ -n "$above" ]; then
            echo "top=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: $above is stacked on this PR, so CI runs there."
          else
            echo "top=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.top == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Already built these site inputs?
        id: passed
        if: steps.check.outputs.top == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # The preview job's condition.
          PREVIEWED: >-
            ${{ github.event.pull_request.head.repo.full_name == github.repository
            && contains(format(',{0},', vars.PREVIEW_AUTHORS || 'riley-wv'), format(',{0},', github.event.pull_request.user.login)) }}
        run: |
          mapfile -t quoted < <(node -e 'try { for (const r of require("./landing/data/conformance.json").rows) if (r.source) console.log(r.source) } catch {}')
          hash=$({ git ls-files -s -- landing ecosystem/STATUS.md .github/workflows/pages.yml
                   [ "${#quoted[@]}" -eq 0 ] || git ls-files -s -- "${quoted[@]}"; } | sha256sum | cut -c1-40)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          [ "$PREVIEWED" != true ] || exit 0
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=pages-pass-$hash&per_page=5" \
            --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length' || echo 0)
          if [ "$n" -gt 0 ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: these site inputs already built in another run."
          fi

  build:
    needs: stack
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.stack.outputs.top == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SITE_MODE: ${{ vars.SITE_MODE }}
      SITE_URL: ${{ vars.SITE_URL }}
      NEXT_TELEMETRY_DISABLED: 1
      # PostHog: without a key the site is built without analytics. Pull requests only reach
      # previews, so their events carry site_env=preview.
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY || vars.POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      NEXT_PUBLIC_POSTHOG_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      # PRs: the head commit, not the merge ref (in a GitHub stack the merge ref can pull in
      # another stack's branches).
      # The full history: the site links a measurement's commit only when this repository has
      # it (landing/lib/commits.mjs).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
        working-directory: landing
      # next build, then scripts/check.mjs: content, quoted numbers, lib/tools.ts, links, anchors.
      - run: npm run build
        working-directory: landing
      # Dogfooding: the type check again, through ts-r's drop-in tsc (@ts-r.dev/typescript; next
      # build's own check above runs TypeScript, see landing/AGENTS.md). After the build, so
      # next-env.d.ts and .next/types exist. A fresh runner has no parity cache, so the drop-in
      # runs ts-r-check and TypeScript side by side and keeps ts-r-check's result only when the
      # two match. A mismatch is a ts-r bug, not a site bug: TypeScript's result is used, and this
      # step warns and prints the report.
      - name: Type-check with ts-r (@ts-r.dev/typescript)
        working-directory: landing
        env:
          TS_R_TSC_VERBOSE: 1
          TS_R_CACHE_DIR: ${{ runner.temp }}/ts-r
        run: |
          status=0
          npm run typecheck || status=$?
          for report in "$TS_R_CACHE_DIR"/typescript/parity/*.txt; do
            [ -e "$report" ] || continue
            echo "::warning title=ts-r parity::ts-r-check and TypeScript disagree on landing/ (a ts-r bug); TypeScript's result was used. Report below."
            cat "$report"
          done
          exit "$status"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/out
      - name: Record the pass
        if: github.event_name == 'pull_request'
        run: mkdir -p pages-pass-marker && echo "${{ github.sha }}" > pages-pass-marker/sha
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: pages-pass-${{ needs.stack.outputs.hash }}
          path: pages-pass-marker
          retention-days: 30

  deploy:
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  preview:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(format(',{0},', vars.PREVIEW_AUTHORS || 'riley-wv'), format(',{0},', github.event.pull_request.user.login))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR: ${{ github.event.pull_request.number }}
      HOST: preview-pr-${{ github.event.pull_request.number }}.ts-r.dev
      WRANGLER_SEND_METRICS: false
    steps:
      - id: cf
        name: Check the Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No preview: set secret CLOUDFLARE_API_TOKEN and variable CLOUDFLARE_ACCOUNT_ID."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cf.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact
      - if: steps.cf.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy to Cloudflare
        if: steps.cf.outputs.ok == 'true'
        run: |
          mkdir _site
          tar -xf artifact/artifact.tar -C _site
          # Previews stay out of search engines.
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > _site/_headers
          cat > wrangler.json <<EOF
          {
            "name": "ts-r-preview-pr-$PR",
            "compatibility_date": "2025-09-01",
            "assets": { "directory": "./_site", "html_handling": "auto-trailing-slash", "not_found_handling": "404-page" },
            "workers_dev": false,
            "preview_urls": false,
            "routes": [{ "pattern": "$HOST", "custom_domain": true }]
          }
          EOF
          npx -y wrangler@4 deploy --config wrangler.json
      - name: Link the preview
        if: steps.cf.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- cf-preview -->'
          body="$marker
          **Preview:** https://$HOST/ · [donate page](https://$HOST/donate/)

          Built from $SHA. Removed when this pull request closes."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
          # The label tells preview-cleanup.yml this PR has a preview to delete when it closes.
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f 'labels[]=preview' > /dev/null
