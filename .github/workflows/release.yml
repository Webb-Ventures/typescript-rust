name: Release

# Builds every target, attaches archives, SHA256SUMS and an SBOM to a GitHub release, and
# publishes the npm packages (npm/README.md) with npm trusted publishing (OIDC) and provenance.
#
# A release is a pull request into its own branch, and merging it publishes:
#   1. A maintainer's release script creates the branch release/vX.Y.Z (or release/vX.Y.Z-<label>:
#      release/v0.1.0, release/v0.1.0-alpha.2) from main, pushes a branch release-prep/vX.Y.Z with
#      the version bump, the CHANGELOG entry and the README's release benchmark table, and opens
#      a pull request from it into release/vX.Y.Z.
#   2. Every push to that pull request runs this workflow as a dry run, a check on the PR:
#      everything builds and `npm publish --dry-run` runs; no tag, no GitHub release.
#   3. Merging the pull request publishes: the push it makes to release/vX.Y.Z runs this
#      workflow for real. It doesn't build again when the PR's last dry run built exactly this
#      code: it publishes that run's binaries (see "Reusing the dry run's build" below). It tags
#      that commit vVERSION, creates the GitHub release (archives,
#      SHA256SUMS, an SBOM; the notes are the version's CHANGELOG.md entry) and publishes the
#      npm packages. It refuses 0.0.0, a version that doesn't match the branch, a version whose
#      tag already exists and a version with no CHANGELOG.md entry.
#   4. A pull request from release/vX.Y.Z into main brings the version and CHANGELOG back (the
#      release script's next step; this workflow's token can't open pull requests).
# Any other push to a release branch (creating it, a direct push) publishes nothing, and nothing
# on main publishes. A failed publish: re-run the run's failed jobs (packages already on npm are
# skipped), or merge a fix into the release branch, which publishes again.
# By hand (Actions > Release > Run workflow): a dry run on any branch.
#
# Reusing the dry run's build: a PR dry run that passes uploads a marker artifact
# release-tree-<tree>, named after the git tree it built (the PR merged into its base). On the
# merge, the version job looks for that marker for the merged commit's tree: the same tree is the
# same source, and nothing in a build depends on the commit (no hashes or dates are embedded).
# Only a run from a branch of this repository counts (a fork's run uploads what it likes). The
# release and npm jobs then download that run's dist-* archives instead of this run's. No
# marker (the base moved, the dry run failed, or its artifacts expired after 14 days): it builds.
#
# npm auth: trusted publishing (OIDC), no long-lived token. The npm job runs on a GitHub-hosted
# runner (ubuntu-latest) because npm trusted publishing does not accept self-hosted runners.
# npm only lets you add a trusted publisher to a package
# that already exists, so a new package's first publish needs a token: if secret NPM_TOKEN is
# set, the run uses it (npm still prefers OIDC for a package that has a trusted publisher);
# otherwise the run uses OIDC alone. The publish step logs which one it used.
#
# A person must set up, once:
#   - environment `release`: deployment branches limited to `release/v*` (dry runs don't use
#     it), and optionally required reviewers to gate publishing.
#   - for each of the 64 packages listed in npm/README.md (`@ts-r.dev/cli`, `@ts-r.dev/typescript`, the six
#     tool packages `@ts-r.dev/{run,dev,build,check,lint,lsp}` and the 56 platform packages
#     `@ts-r.dev/{cli,run,dev,build,check,lint,lsp}-<platform>`), all owned by the `ts-r.dev` npm
#     org (`@ts-r.dev/cli` is the `ts-r` launcher):
#     1. Publish it once: run this workflow with secret NPM_TOKEN set to a granular access token
#        (packages and scopes: read and write, all packages; bypass 2FA; a short expiry), or
#        publish it locally with 2FA. Already-published versions are skipped, so a rerun only
#        publishes what is missing.
#     2. On npmjs.com, package Settings > Trusted publishing: add a trusted publisher, GitHub
#        Actions, organization or user `Webb-Ventures`, repository `typescript-rust`, workflow
#        `release.yml`, environment `release`.
#     3. Same page, Publishing access: "Require two-factor authentication and disallow tokens".
#   Then delete secret NPM_TOKEN and revoke the token.
#
# Binaries:
#   macOS arm64, Linux x64/arm64, Windows x64: PGO (`cargo xtask pgo --profile dist`),
#     trained on the runner: repo fixtures, TypeScript's compiler test cases, up to 60
#     ecosystem packages and (not on Windows) two small public bench repos, date-fns and
#     three.js x10 (a local run trains on every fetched bench repo).
#   Linux: one job per architecture and libc, so glibc and musl build in parallel; each trains
#     on the native glibc build, then rebuilds with cargo-zigbuild against glibc 2.17 or musl.
#   macOS arm64 runs on a larger (paid) runner, macos-15-xlarge: its PGO build is the longest
#     job of a release.
#   macOS x64: cross-built on arm64 without PGO.
#   Windows arm64: cross-built on x64 without PGO (the profile can't be trained there).
# If PGO fails on a runner, the job warns and ships the plain `dist` build instead.

on:
  # Merging a release PR: publishes (the version job checks the push is that merge).
  push:
    branches: ["release/v*"]
  # A release PR's dry run.
  pull_request:
    branches: ["release/v*"]
  # A dry run by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A newer push to a release PR replaces its dry run; a publish is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PACKAGES: -p ts_r_cli -p ts_r_run -p ts_r_dev -p ts_r_build -p ts_r_check -p ts_r_lint_cli -p ts_r_lsp
  BINARIES: ts-r ts-r-run ts-r-dev ts-r-build ts-r-check ts-r-lint ts-r-lsp

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
      npm_tag: ${{ steps.v.outputs.npm_tag }}
      skip: ${{ steps.v.outputs.skip }}
      tree: ${{ steps.v.outputs.tree }}
      reuse_run: ${{ steps.reuse.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          # The release branch: a PR's base, or the branch pushed to.
          BRANCH: ${{ github.base_ref || github.ref_name }}
          CREATED: ${{ github.event.created }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          dry_run=true
          if [ "$EVENT" = push ]; then
            # Only the merge of a pull request into this branch publishes; creating the branch
            # or pushing to it directly does nothing.
            merged=0
            if [ "$CREATED" != true ]; then
              for _ in 1 2 3 4 5; do
                merged=$(gh api "repos/$REPO/commits/$SHA/pulls" \
                  --jq "[.[] | select(.merged_at != null and .base.ref == \"$BRANCH\")] | length")
                [ "$merged" != 0 ] && break
                sleep 5
              done
            fi
            if [ "$merged" = 0 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "A push to $BRANCH that isn't a merged pull request: nothing to publish." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            dry_run=false
          fi
          if [[ "$BRANCH" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)(-([0-9A-Za-z.-]+))?$ ]]; then
            core="${BASH_REMATCH[1]}" label="${BASH_REMATCH[3]}"
            if [ "${version%%-*}" != "$core" ]; then
              echo "::error::branch $BRANCH is for $core but [workspace.package] version is $version"
              exit 1
            fi
            if [ "$version" != "$core" ] && { [ -z "$label" ] || [ "${label#"${version#*-}"}" = "$label" ]; }; then
              echo "::error::[workspace.package] version $version is a pre-release; the branch must be release/v$version or release/v$version-<label>"
              exit 1
            fi
          elif [ "$EVENT" != workflow_dispatch ]; then
            echo "::error::not a release branch: $BRANCH (release/vX.Y.Z or release/vX.Y.Z-<label>)"
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || [ "$version" = 0.0.0 ]; then
            echo "::error::[workspace.package] version is $version; the release PR sets the version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            if [ "$dry_run" != true ]; then
              echo "::error::v$version is already released (tag v$version exists); release the next version from a new branch"
              exit 1
            fi
            echo "::warning::v$version is already released (tag v$version exists)"
          fi
          if ! grep -qF "## [v$version]" CHANGELOG.md; then
            if [ "$dry_run" != true ]; then
              echo "::error::CHANGELOG.md has no entry for v$version; the release PR adds it"
              exit 1
            fi
            echo "::warning::CHANGELOG.md has no entry for v$version"
          fi
          # A prerelease of a package with no stable version on npm still publishes under latest
          # (and then gets next): .github/scripts/npm-publish.sh says why.
          npm_tag=latest
          case "$version" in *-*) npm_tag=next ;; esac
          {
            echo "version=$version"
            echo "dry_run=$dry_run"
            echo "npm_tag=$npm_tag"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
          } >> "$GITHUB_OUTPUT"
          echo "ts-r $version for $BRANCH (dry run: $dry_run, npm dist-tag: $npm_tag)" >> "$GITHUB_STEP_SUMMARY"
      - name: Reuse the dry run's build?
        id: reuse
        if: steps.v.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          TREE: ${{ steps.v.outputs.tree }}
        run: |
          # The newest unexpired marker for this tree from a run on this repository's own branch,
          # whose run passed.
          runs=$(gh api "repos/$REPO/actions/artifacts?name=release-tree-$TREE&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == $REPO_ID) | .workflow_run.id] | unique | reverse | .[]")
          for id in $runs; do
            if [ "$(gh api "repos/$REPO/actions/runs/$id" --jq '.event + " " + .conclusion')" = "pull_request success" ]; then
              echo "run=$id" >> "$GITHUB_OUTPUT"
              echo "Publishing the binaries of dry run [$id](https://github.com/$REPO/actions/runs/$id), which built this tree ($TREE)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "No passed dry run built this tree ($TREE): building." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.skip != 'true' && needs.version.outputs.reuse_run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          # The longest job (a PGO build): on a larger, paid runner.
          - name: macos-arm64
            os: macos-15-xlarge
            targets: aarch64-apple-darwin
            builder: cargo
            pgo: true
          # Cross-compiled on Apple silicon, so no PGO (training would run the instrumented x64
          # build).
          - name: macos-x64
            os: macos-15
            targets: x86_64-apple-darwin
            builder: cargo
            pgo: false
          # glibc and musl in separate jobs, so they build in parallel (each trains its own
          # profile on the native glibc build).
          - name: linux-x64-gnu
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu.2.17
            builder: zigbuild
            pgo: true
          - name: linux-x64-musl
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-musl
            builder: zigbuild
            pgo: true
          - name: linux-arm64-gnu
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu.2.17
            builder: zigbuild
            pgo: true
          - name: linux-arm64-musl
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-musl
            builder: zigbuild
            pgo: true
          - name: windows-x64
            os: windows-2025
            targets: x86_64-pc-windows-msvc
            builder: cargo
            pgo: true
          - name: windows-arm64
            os: windows-2025
            targets: aarch64-pc-windows-msvc
            builder: cargo
            pgo: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGETS: ${{ matrix.targets }}
      BUILDER: ${{ matrix.builder }}
      PGO: ${{ matrix.pgo }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain and targets
        run: |
          rustup toolchain install
          for t in $TARGETS; do rustup target add "${t%%.2.*}"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: matrix.builder == 'zigbuild'
        uses: mlugg/setup-zig@v2
      - if: matrix.builder == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: TypeScript lib files (shipped next to ts-r-check and ts-r-lsp)
        run: cargo xtask upstream sync --minimal
      - name: TypeScript compiler test cases (PGO training input)
        if: matrix.pgo
        run: git -C target/upstream/typescript sparse-checkout add /tests/cases/compiler/
      - name: Ecosystem samples (PGO training input)
        if: matrix.pgo && runner.os != 'Windows'
        continue-on-error: true
        run: scripts/limit.sh --time-s 1200 -- cargo xtask ecosystem --top 60 --stages parse --no-status
      - name: Bench repo package cache (PGO training input)
        if: matrix.pgo && runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ts-r/bench
          key: bench-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bench/repos.toml') }}
          restore-keys: bench-pkgs-${{ runner.os }}-${{ runner.arch }}-
      - name: Public bench repos (PGO training input)
        if: matrix.pgo && runner.os != 'Windows'
        continue-on-error: true
        run: |
          corepack enable
          cargo xtask bench --fetch-repos --repos date-fns,three-x10

      - name: Build
        run: |
          set -euo pipefail
          pgo_ok=false
          if [ "$PGO" = true ]; then
            # Instrumented build of the runner's own target, training, merge.
            if cargo xtask pgo --profile dist --no-rebuild; then
              pgo_ok=true
            else
              echo "::warning::PGO training failed on ${RUNNER_OS}; shipping the plain dist build"
            fi
          fi
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          for t in $TARGETS; do
            triple="${t%%.2.*}"
            if [ "$pgo_ok" = true ]; then
              cargo xtask pgo --profile dist --use-profile target/pgo/merged.profdata \
                --builder "$BUILDER" --target "$t"
              src="target/pgo/optimized/$triple/dist"
            else
              if [ "$BUILDER" = zigbuild ]; then sub=zigbuild; else sub=build; fi
              # shellcheck disable=SC2086
              cargo "$sub" --profile dist --target "$t" $PACKAGES --bins
              src="target/$triple/dist"
            fi
            name="ts-r-$VERSION-$triple"
            mkdir -p "dist/$name/bin"
            for b in $BINARIES; do cp "$src/$b$exe" "dist/$name/bin/"; done
            # ts-r-check and ts-r-lsp find TypeScript's lib files in <exe>/../lib.
            mkdir -p "dist/$name/lib"
            up=target/upstream/typescript
            cp "$up"/tsc/internal/bundled/libs/*.d.ts "dist/$name/lib/"
            cp "$up/LICENSE.txt" "dist/$name/lib/TypeScript-LICENSE.txt"
            cp "$up/ThirdPartyNoticeText.txt" "dist/$name/lib/TypeScript-ThirdPartyNoticeText.txt"
            cp README.md LICENSE "dist/$name/"
            echo "$triple: $([ "$pgo_ok" = true ] && echo PGO || echo dist)" >> "$GITHUB_STEP_SUMMARY"
          done
          rm -rf target/pgo/profiles

      - name: Smoke test
        run: |
          set -euo pipefail
          for t in $TARGETS; do
            triple="${t%%.2.*}"
            case "$triple" in aarch64-pc-windows-msvc) continue ;; esac
            # The x64 macOS build is cross-compiled on Apple silicon: run it only under Rosetta.
            if [ "$triple" = x86_64-apple-darwin ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "::notice::No Rosetta on this runner; the x86_64-apple-darwin smoke test is skipped"
              continue
            fi
            bin="dist/ts-r-$VERSION-$triple/bin"
            "$bin/ts-r" --version
            "$bin/ts-r-build" --version
            "$bin/ts-r-run" --version
            # A run, and a check that finds the archive's lib/ files.
            smoke="$RUNNER_TEMP/smoke-$triple"
            mkdir -p "$smoke"
            printf 'const n: number = 1;\nconsole.log(n);\n' > "$smoke/index.ts"
            printf '{ "compilerOptions": { "strict": true, "noEmit": true, "types": [] } }\n' > "$smoke/tsconfig.json"
            "$bin/ts-r-run" "$smoke/index.ts"
            "$bin/ts-r-check" -p "$smoke/tsconfig.json" --noEmit
          done

      - name: Archive
        run: |
          set -euo pipefail
          mkdir -p out
          cd dist
          for d in */; do
            d="${d%/}"
            case "$d" in
              *windows*) 7z a -bd "../out/$d.zip" "$d" >/dev/null ;;
              *) tar -czf "../out/$d.tar.gz" "$d" ;;
            esac
          done
          ls -l ../out
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub release (checksums, SBOM)
    needs: [version, build]
    # The build is skipped when the dry run's is reused.
    if: >-
      !cancelled() && needs.version.result == 'success' && needs.version.outputs.skip != 'true'
      && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.version.outputs.reuse_run != ''))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DRY_RUN: ${{ needs.version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: out
          merge-multiple: true
          # The dry run's archives when reused; with no token, this run's.
          run-id: ${{ needs.version.outputs.reuse_run || github.run_id }}
          github-token: ${{ needs.version.outputs.reuse_run != '' && github.token || '' }}
      - name: SBOM (Cargo.lock, SPDX)
        uses: anchore/sbom-action@v0
        with:
          file: Cargo.lock
          format: spdx-json
          output-file: out/ts-r-${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        working-directory: out
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: out/*
          retention-days: 14
      - name: Create the GitHub release
        if: needs.version.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # The notes are the version's CHANGELOG.md entry, without its heading.
          awk -v h="## [v$VERSION]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::warning::CHANGELOG.md has no entry for v$VERSION; using GitHub's generated notes"
            notes=(--generate-notes)
          else
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          fi
          # Tags vVERSION on the release branch's head: the merge this run built.
          # shellcheck disable=SC2086
          gh release create "v$VERSION" out/* --target "$GITHUB_SHA" "${notes[@]}" --title "ts-r $VERSION" $prerelease

  npm:
    name: npm publish
    needs: [version, build, release]
    # The version job already decides; this keeps a publish (not a dry run) to a push to a
    # release branch, and the environment (npm trusted publishing is pinned to it) to publishing.
    if: >-
      !cancelled() && needs.release.result == 'success'
      && (needs.version.outputs.dry_run == 'true' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v')))
    # GitHub-hosted on purpose: npm trusted publishing rejects self-hosted runners.
    runs-on: ubuntu-latest
    environment: ${{ needs.version.outputs.dry_run != 'true' && 'release' || '' }}
    permissions:
      contents: read
      actions: read # the dry run's archives, when reused
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DRY_RUN: ${{ needs.version.outputs.dry_run }}
      NPM_TAG: ${{ needs.version.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - name: TypeScript lib files for @ts-r.dev/check and @ts-r.dev/lsp
        run: cargo xtask upstream sync --minimal
      # No registry-url: setup-node would write an .npmrc with a placeholder NODE_AUTH_TOKEN. The
      # publish step writes its own .npmrc only when it uses secret NPM_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm CLI 11.21 or newer (trusted publishing, and npm dist-tag add with it)
        run: |
          set -euo pipefail
          npm install -g "npm@^11.21.0"
          v=$(npm --version)
          if ! node -e 'const [a, b] = process.argv[1].split(".").map((n) => parseInt(n, 10)); process.exit(a > 11 || (a === 11 && b >= 21) ? 0 : 1)' "$v"; then
            echo "::error::npm $v is older than 11.21.0, which trusted publishing for npm dist-tag needs"
            exit 1
          fi
          echo "npm $v"
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: archives
          merge-multiple: true
          run-id: ${{ needs.version.outputs.reuse_run || github.run_id }}
          github-token: ${{ needs.version.outputs.reuse_run != '' && github.token || '' }}
      - name: Unpack binaries into artifacts/<triple>/
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p unpacked artifacts
          for f in archives/*.tar.gz; do tar -xzf "$f" -C unpacked; done
          for f in archives/*.zip; do unzip -q "$f" -d unpacked; done
          for d in unpacked/*/; do
            d="${d%/}"
            triple="${d#unpacked/ts-r-"$VERSION"-}"
            mv "$d/bin" "artifacts/$triple"
          done
          ls artifacts
      - name: Build the npm packages
        run: |
          set -euo pipefail
          args=()
          for d in artifacts/*/; do d="${d%/}"; args+=(--target "${d#artifacts/}"); done
          node npm/scripts/build-packages.mjs --artifacts artifacts "${args[@]}" \
            --version "$VERSION" --out npm-dist
          count=$(node -p 'require("./npm-dist/packages.json").targets.length')
          if [ "$count" != 8 ]; then echo "::error::expected 8 targets, got $count"; exit 1; fi
      - name: npm publish (trusted publishing, or NPM_TOKEN for a first publish)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # OIDC by default. Secret NPM_TOKEN, when set, is only for publishing a package for the
          # first time (npm can't attach a trusted publisher to a package that doesn't exist yet).
          if [ -n "$NPM_TOKEN" ]; then
            npmrc="$RUNNER_TEMP/npmrc"
            # npm expands ${NPM_TOKEN} from the environment; the token never lands in the file.
            # shellcheck disable=SC2016
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$npmrc"
            export NPM_CONFIG_USERCONFIG="$npmrc"
            auth="token (secret NPM_TOKEN; npm still uses OIDC for packages with a trusted publisher)"
          else
            auth="OIDC trusted publishing (no token)"
          fi
          echo "npm auth: $auth"
          echo "npm auth: $auth" >> "$GITHUB_STEP_SUMMARY"
          # Provenance is automatic with trusted publishing; --provenance also covers the token path.
          # Two parallel phases: every platform package, then every front package.
          bash .github/scripts/npm-publish.sh npm-dist
      # The last step of a passed PR dry run: its build can be published when the PR merges as is.
      - name: Mark this build reusable by the merge
        if: github.event_name == 'pull_request' && needs.version.outputs.dry_run == 'true'
        run: echo "${{ needs.version.outputs.tree }}" > "$RUNNER_TEMP/tree"
      - if: github.event_name == 'pull_request' && needs.version.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-tree-${{ needs.version.outputs.tree }}
          path: ${{ runner.temp }}/tree
          retention-days: 14
