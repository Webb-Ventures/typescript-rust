name: Sync back

# The core team develops ts-r in a private repo and syncs it here as pull requests from branches
# sync/tsc-rust-<sha>. Every other pull request merged into main here (yours) is carried back
# there by this workflow: the merge's diff is applied to that repo's main on branch
# public/pr-<n>, with you as the commit's author, and a pull request is opened there crediting
# you. Once it merges there, the next sync brings nothing new back here. Script:
# .github/scripts/sync-back.sh.
#
# Secret GH_PRIVATE_REPO_TOKEN: a fine-grained token on the development repo (variable
# PRIVATE_REPO, default Webb-Ventures/tsc-rust) with contents, pull requests and workflows
# read/write. Without it the workflow does nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of a merged pull request to carry back
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sync-back
  cancel-in-progress: false

jobs:
  back:
    name: carry back to the development repo
    if: github.repository == 'Webb-Ventures/typescript-rust'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Carry back
        env:
          PRIVATE_REPO: ${{ vars.PRIVATE_REPO || 'Webb-Ventures/tsc-rust' }}
          PRIVATE_TOKEN: ${{ secrets.GH_PRIVATE_REPO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bash .github/scripts/sync-back.sh
