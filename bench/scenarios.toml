# Benchmark scenarios for `cargo xtask bench` (see .agents/skills/bench-compare/SKILL.md).
#
# Placeholders: {bin} = our release binaries (--bin-dir, default target/release),
# {node_bin} = bench/node_modules/.bin (pinned reference tools from bench/package.json),
# {input} = the scenario's input file. Commands run from the repo root.
#
# `ours = true` marks ts-r tools; only those are gated against the baseline: >5% slower fails
# when the slowdown is also above `noise_sigmas` standard deviations of the two runs combined.
# `pending = "<why>"` keeps a tool listed but not run until its binary exists.
# `requires = [...]` skips a tool until the listed paths exist.
# `ignore_failure = true` times a tool even though it exits non-zero (use sparingly: it hides
# broken commands).
# `setup = "<cmd>"` (per scenario) runs once before each tool's runs, untimed (hyperfine
# --setup), in the same directory and under the same cap; placeholders allowed.

[settings]
warmup = 3
runs = 10
max_regression = 0.05
noise_sigmas = 2.0

[[scenario]]
id = "parse-dom-dts"
title = "Parse throughput: lib.dom (declarations, single thread)"
measures = "MB/s, single thread (includes process start-up until we add in-process harnesses). Target: parser >= Oxc."
input = "target/upstream/typescript/tsc/internal/bundled/libs/lib.dom.d.ts"
input_hint = "run `cargo xtask upstream sync --minimal`"

  [[scenario.tool]]
  name = "ts-r"
  ours = true
  cmd = "{bin}/ts-r-check --parse-only {input}"
  requires = ["{bin}/ts-r-check"]
  pending = "ts-r-check has no --parse-only flag yet; the parser is measured in-process instead (parse_corpus, bench/README.md)"

  [[scenario.tool]]
  name = "oxc-parser"
  cmd = "node bench/js/oxc-parse.mjs {input}"
  requires = ["bench/node_modules/oxc-parser"]

  [[scenario.tool]]
  name = "esbuild"
  cmd = "{node_bin}/esbuild --loader=ts --log-level=error < {input} > /dev/null"
  requires = ["{node_bin}/esbuild"]

  [[scenario.tool]]
  name = "tsc-7"
  cmd = "{node_bin}/tsc --noEmit --noLib --noResolve --skipLibCheck {input}"
  requires = ["{node_bin}/tsc"]
  # Exits non-zero under --noLib (missing global types); we only time parse + bind.
  ignore_failure = true

[[scenario]]
id = "run-startup"
title = "ts-r run: start-up of a small TypeScript script"
measures = "Wall time to run bench/fixtures/hello.ts through the launcher (ts-r run, which starts ts-r-run on Node). Target: <= tsx."

  [[scenario.tool]]
  name = "ts-r"
  ours = true
  cmd = "{bin}/ts-r run bench/fixtures/hello.ts"
  requires = ["{bin}/ts-r", "{bin}/ts-r-run"]

  [[scenario.tool]]
  name = "tsx"
  cmd = "{node_bin}/tsx bench/fixtures/hello.ts"
  requires = ["{node_bin}/tsx"]

  [[scenario.tool]]
  name = "node-strip-types"
  cmd = "node --experimental-strip-types --no-warnings bench/fixtures/hello.ts"

[[scenario]]
id = "version-startup"
title = "Process start-up: --version"
measures = "Start-up time per binary. Target: < 5 ms for every ts-r tool."
no_shell = true
runs = 30

  [[scenario.tool]]
  name = "ts-r"
  ours = true
  cmd = "{bin}/ts-r --version"
  requires = ["{bin}/ts-r"]

  [[scenario.tool]]
  name = "esbuild"
  cmd = "{node_bin}/esbuild --version"
  requires = ["{node_bin}/esbuild"]

  [[scenario.tool]]
  name = "tsc-7"
  cmd = "{node_bin}/tsc --version"
  requires = ["{node_bin}/tsc"]

# ---------------------------------------------------------------------------------------------
# Pinned public repos (bench/repos.toml, bench/README.md). These run only when --repos selects
# them, inside the checkout (target/bench-repos/<name>, `{repo}`), each tool under
# scripts/limit.sh with the repo's memory cap. `{bin}`, `{node_bin}` and `{tmp}` are absolute
# there. Fetch first: `cargo xtask bench --fetch-repos --repos <names>`.
#
# Check scenarios check `<tsconfig>.ts-r-bench.json`, a wrapper the fetch writes next to each
# project: it extends the project with noEmit, incremental and composite off (plus the repo's
# check_options), so every tool does the same cold, write-nothing check. `ts-r-check` runs
# without its saved history (cold, like tsc); `ts-r-check-warm` with it. `tsc-7` is the pinned
# TypeScript 7; `tsc-repo` the repo's own TypeScript. Projects have errors under TS 7, so every
# tool may exit non-zero: compare diagnostics separately (bench/README.md, smoke runs).
#
# Lint scenarios compare ts-r-lint (type-aware rules on, and off) with the repo's own linter
# (ESLint, oxlint or Biome).


# ---- TypeScript 7's set (small and medium: these run on the shared machine) ----

[[scenario]]
id = "check-trpc"
repo = "trpc"
title = "Type-check: trpc packages/server (trpc/trpc, pinned)"
measures = "Wall time of one full check, cold. Target: <= tsc 7."
warmup = 1
runs = 5

  [[scenario.tool]]
  name = "ts-r-check"
  ours = true
  cmd = "{bin}/ts-r-check -p packages/server/tsconfig.ts-r-bench.json --pretty false --no-history"
  requires = ["{bin}/ts-r-check"]
  ignore_failure = true

  [[scenario.tool]]
  name = "ts-r-check-warm"
  ours = true
  cmd = "{bin}/ts-r-check -p packages/server/tsconfig.ts-r-bench.json --pretty false"
  requires = ["{bin}/ts-r-check"]
  ignore_failure = true

  [[scenario.tool]]
  name = "tsc-7"
  cmd = "{node_bin}/tsc -p packages/server/tsconfig.ts-r-bench.json --pretty false"
  requires = ["{node_bin}/tsc"]
  ignore_failure = true

  [[scenario.tool]]
  name = "tsc-repo"
  cmd = "node_modules/.bin/tsc -p packages/server/tsconfig.ts-r-bench.json --pretty false"
  requires = ["{repo}/node_modules/.bin/tsc"]
  ignore_failure = true

[[scenario]]
id = "lint-trpc"
repo = "trpc"
title = "Lint: trpc server and client sources with its ESLint config (type-aware)"
measures = "Wall time of one lint run. Target: <= ESLint."
warmup = 1
runs = 3

  [[scenario.tool]]
  name = "ts-r-lint"
  ours = true
  cmd = "{bin}/ts-r-lint --no-gitignore --threads 4 packages/server/src packages/client/src"
  requires = ["{bin}/ts-r-lint"]
  ignore_failure = true

  [[scenario.tool]]
  name = "ts-r-lint-no-types"
  ours = true
  cmd = "{bin}/ts-r-lint --no-gitignore --threads 4 --no-type-check packages/server/src packages/client/src"
  requires = ["{bin}/ts-r-lint"]
  ignore_failure = true

  [[scenario.tool]]
  name = "eslint"
  cmd = "node_modules/.bin/eslint packages/server/src packages/client/src"
  requires = ["{repo}/node_modules/.bin/eslint"]
  ignore_failure = true

# Like-for-like: the same config file for both tools, the same files. The setup runs
# bench/js/eslint-same-rules.mjs with the ts-r-lint under test: it writes trpc's eslint.config.js
# with only the rules that binary lists (--list-rules), as eslint.ts-r-same-rules.config.mjs
# (type-aware rules included) and eslint.ts-r-same-rules-untyped.config.mjs (only rules that need
# no types, and no TypeScript program for ESLint). The untyped pair is the comparison; the typed
# pair runs ts-r-lint with its parity gate off (TS_R_LINT_PARITY=off: type-aware rules run on our
# checker even where its diagnostics differ from tsc's) and with an empty cache every run.
[[scenario]]
id = "lint-trpc-same-rules"
repo = "trpc"
title = "Lint: trpc server and client sources, ESLint restricted to ts-r-lint's rules"
measures = "Wall time of one lint run, with the same rules, options and files for both tools. Target: <= ESLint."
setup = "node {node_bin}/../../js/eslint-same-rules.mjs {bin}/ts-r-lint eslint.config.js eslint.ts-r-same-rules"
warmup = 1
runs = 5

  [[scenario.tool]]
  name = "ts-r-lint"
  ours = true
  cmd = "{bin}/ts-r-lint --no-gitignore --threads 4 --no-type-check -c eslint.ts-r-same-rules-untyped.config.mjs packages/server/src packages/client/src"
  requires = ["{bin}/ts-r-lint", "{repo}/node_modules/.bin/eslint"]
  ignore_failure = true

  [[scenario.tool]]
  name = "ts-r-lint-cold-config"
  ours = true
  cmd = "TS_R_LINT_NO_CONFIG_CACHE=1 {bin}/ts-r-lint --no-gitignore --threads 4 --no-type-check -c eslint.ts-r-same-rules-untyped.config.mjs packages/server/src packages/client/src"
  requires = ["{bin}/ts-r-lint", "{repo}/node_modules/.bin/eslint"]
  ignore_failure = true

  [[scenario.tool]]
  name = "eslint"
  cmd = "node_modules/.bin/eslint -c eslint.ts-r-same-rules-untyped.config.mjs packages/server/src packages/client/src"
  requires = ["{bin}/ts-r-lint", "{repo}/node_modules/.bin/eslint"]
  ignore_failure = true

  [[scenario.tool]]
  name = "ts-r-lint-typed-cold"
  ours = true
  cmd = "rm -rf {tmp}/lint-trpc-same-rules-cache && TS_R_CACHE_DIR={tmp}/lint-trpc-same-rules-cache TS_R_LINT_PARITY=off {bin}/ts-r-lint --no-gitignore --threads 4 -c eslint.ts-r-same-rules.config.mjs packages/server/src packages/client/src"
  requires = ["{bin}/ts-r-lint", "{repo}/node_modules/.bin/eslint"]
  ignore_failure = true

  [[scenario.tool]]
  name = "eslint-typed"
  cmd = "node_modules/.bin/eslint -c eslint.ts-r-same-rules.config.mjs packages/server/src packages/client/src"
  requires = ["{bin}/ts-r-lint", "{repo}/node_modules/.bin/eslint"]
  ignore_failure = true

