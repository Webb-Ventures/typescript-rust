# ---- Bundler: three.js x10 ----
# Ten copies of three.js's src imported together from one entry (bench/README.md), bundled
# minified with source maps into one IIFE with a global name. Outputs go to target/bench-tmp.

[[scenario]]
id = "build-three-x10"
repo = "three-x10"
title = "Bundle: three.js x10 (10 copies of mrdoob/three.js src), minified, source maps"
measures = "Wall time of one bundling process. Target: <= esbuild."
warmup = 2
runs = 10

  [[scenario.tool]]
  name = "ts-r-build"
  ours = true
  cmd = "{bin}/ts-r-build bench/entry.js --bundle --minify --sourcemap --format=iife --global-name=THREE --no-cache --threads=4 --log-level=warning --outfile={tmp}/three-x10-tsr.js"
  requires = ["{bin}/ts-r-build"]

  [[scenario.tool]]
  name = "ts-r-build-cached"
  ours = true
  cmd = "{bin}/ts-r-build bench/entry.js --bundle --minify --sourcemap --format=iife --global-name=THREE --threads=4 --log-level=warning --outfile={tmp}/three-x10-tsr-cached.js"
  requires = ["{bin}/ts-r-build"]

  [[scenario.tool]]
  name = "esbuild"
  cmd = "{node_bin}/esbuild bench/entry.js --bundle --minify --sourcemap --format=iife --global-name=THREE --log-level=warning --outfile={tmp}/three-x10-esbuild.js"
  requires = ["{node_bin}/esbuild"]

# ---- App bundle: excalidraw ----
# The Excalidraw app (excalidraw/excalidraw, Vite + React + TypeScript), bundled from the bench
# harness entry (bench/dev/excalidraw/main.tsx, copied to ts-r-bench-dev/ by the fetch): the
# app and its packages as source through the root tsconfig's paths, React, Firebase and the
# rest from node_modules. Fonts use the file loader; .scss imports are empty for both tools (no
# Sass compiler in either). Outputs go to target/bench-tmp.

[[scenario]]
id = "build-excalidraw"
repo = "excalidraw"
title = "Bundle: the Excalidraw app (excalidraw/excalidraw, pinned), cold, minified"
measures = "Wall time of one bundling process (no persistent cache), ts-r-build vs esbuild 0.28.2. Target: <= esbuild."
warmup = 2
runs = 10

  [[scenario.tool]]
  name = "ts-r-build"
  ours = true
  cmd = "{bin}/ts-r-build ts-r-bench-dev/main.tsx --bundle --minify --format=esm --jsx=automatic --loader:.woff2=file --loader:.scss=empty --no-cache --threads=4 --log-level=error --outdir={tmp}/excalidraw-tsr"
  requires = ["{bin}/ts-r-build", "{repo}/ts-r-bench-dev/main.tsx"]

  [[scenario.tool]]
  name = "ts-r-build-cached"
  ours = true
  cmd = "{bin}/ts-r-build ts-r-bench-dev/main.tsx --bundle --minify --format=esm --jsx=automatic --loader:.woff2=file --loader:.scss=empty --threads=4 --log-level=error --outdir={tmp}/excalidraw-tsr-cached"
  requires = ["{bin}/ts-r-build", "{repo}/ts-r-bench-dev/main.tsx"]

  [[scenario.tool]]
  name = "esbuild"
  cmd = "{node_bin}/esbuild ts-r-bench-dev/main.tsx --bundle --minify --format=esm --jsx=automatic --loader:.woff2=file --loader:.scss=empty --log-level=error --outdir={tmp}/excalidraw-esbuild"
  requires = ["{node_bin}/esbuild", "{repo}/ts-r-bench-dev/main.tsx"]

[[scenario]]
id = "rebuild-excalidraw"
repo = "excalidraw"
title = "Bundle: the Excalidraw app, 20 edit-and-rebuild cycles"
measures = "Wall time of one process doing a first build and then 20 cycles of editing one component (excalidraw-app/components/AppWelcomeScreen.tsx) and rebuilding in memory (BuildContext::invalidate + build vs esbuild's context.rebuild). Each command also prints its per-rebuild median. Target: <= esbuild."
warmup = 1
runs = 5

  [[scenario.tool]]
  name = "ts-r-build"
  ours = true
  cmd = "{bin}/examples/build_loop {repo} ts-r-bench-dev/main.tsx 20 --minify --format=esm --loader:.woff2=file --loader:.scss=empty --edit excalidraw-app/components/AppWelcomeScreen.tsx"
  requires = ["{bin}/examples/build_loop", "{repo}/ts-r-bench-dev/main.tsx"]

  # bench/js/esbuild-rebuild.mjs, reached from {node_bin} (bench/node_modules/.bin), which is
  # absolute here.
  [[scenario.tool]]
  name = "esbuild"
  cmd = "node {node_bin}/../../js/esbuild-rebuild.mjs {repo} ts-r-bench-dev/main.tsx 20 excalidraw-app/components/AppWelcomeScreen.tsx --minify --format=esm --loader:.woff2=file --loader:.scss=empty"
  requires = ["{node_bin}/esbuild", "{repo}/ts-r-bench-dev/main.tsx"]

