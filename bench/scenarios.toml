title = "Type-check: Sentry frontend (getsentry/sentry, pinned)"
measures = "Wall time of one full check, cold. Target: <= tsc 7."
warmup = 1
runs = 3
time_s = 3600

  [[scenario.tool]]
  name = "ts-r-check"
  ours = true
  cmd = "{bin}/ts-r-check -p tsconfig.ts-r-bench.json --pretty false --no-history"
  requires = ["{bin}/ts-r-check"]
  ignore_failure = true

  [[scenario.tool]]
  name = "ts-r-check-warm"
  ours = true
  cmd = "{bin}/ts-r-check -p tsconfig.ts-r-bench.json --pretty false"
  requires = ["{bin}/ts-r-check"]
  ignore_failure = true

  [[scenario.tool]]
  name = "tsc-7"
  cmd = "{node_bin}/tsc -p tsconfig.ts-r-bench.json --pretty false"
  requires = ["{node_bin}/tsc"]
  ignore_failure = true

  [[scenario.tool]]
  name = "tsc-repo"
  cmd = "node_modules/.bin/tsc -p tsconfig.ts-r-bench.json --pretty false"
  requires = ["{repo}/node_modules/.bin/tsc"]
  ignore_failure = true

