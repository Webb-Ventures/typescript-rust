# Pinned public repositories for `cargo xtask bench` and the editor-memory runs.
# See bench/README.md. Each entry is a commit on the repo's default branch, taken with
# `git ls-remote <url> HEAD` on `date`. Re-pin by hand (update commit and date together) and
# re-run the smoke runs in bench/README.md.
#
# Fields: name (checkout dir under target/bench-repos/ and the --repos key), repo (GitHub
# owner/name), branch, commit, date, group (large-app | monorepo | ts7 | bundler | app), size
# (small | medium | large; large repos need a dedicated machine and --large), sparse
# (sparse-checkout patterns, empty = whole tree), install (shell command run under
# scripts/limit.sh in install_dir), mem_mb (cap for the install and each benchmarked command,
# at most 8192 here), install_time_s, projects (tsconfigs the check scenarios use), linter (the
# repo's own linter, the lint reference), prepare (derived input), scenarios (check, lint,
# build, editor-memory), [repo.editor] files (opened in the editor runs; the first is the
# latency file) and src_dirs (walked by --open-all), notes.
#
# Installs always pass --ignore-scripts (or yarn's equivalent): no lifecycle scripts from
# these repos run on the bench machine. They are offline-first against one shared cache:
# `{cache}` is ~/.cache/ts-r/bench (or $TS_R_BENCH_CACHE), npm and pnpm pass --prefer-offline
# and Yarn 1 --prefer-offline --cache-folder; Yarn berry (--immutable) gets its global cache
# from the environment. A repeat --fetch-repos skips an install whose stamp (commit, commands,
# lockfile hashes, Node version) is unchanged (bench/README.md, "Caches").

# ---------------------------------------------------------------- large apps

[[repo]]
name = "vscode"
repo = "microsoft/vscode"
branch = "main"
commit = "640a33ebdea00ea726190677c98d5ee7b725243e"
date = "2026-10-15"
group = "large-app"
size = "large"
install = "npm ci --prefer-offline --cache {cache}/npm --ignore-scripts --no-audit --no-fund"
mem_mb = 8192
install_time_s = 1800
projects = ["src/tsconfig.json"]
linter = "eslint"
scenarios = ["check", "lint", "editor-memory"]
notes = "Its own check is `tsc -p src/tsconfig.json --noEmit --skipLibCheck` (TypeScript 6 as @typescript/typescript6). ESLint runs local TS plugins from .eslint-plugin-local."

  [repo.editor]
  files = [
    "src/vs/editor/common/model/textModel.ts",
    "src/vs/workbench/browser/workbench.ts",
    "src/vs/platform/instantiation/common/instantiation.ts",
    "src/vs/base/common/lifecycle.ts",
    "src/vs/workbench/contrib/files/browser/views/explorerView.ts",
  ]
  src_dirs = ["src/vs"]

